<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Animada</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="stage">
    <div class="hologram-rig">
      <div class="hologram-backdrop" aria-hidden="true"></div>
      <div class="light-column" aria-hidden="true"></div>
      <div class="image-stack">
        <img class="stack-card is-back" alt="Imagen 1">
        <img class="stack-card is-main" alt="Imagen 2">
        <img class="stack-card is-front" alt="Imagen 3">
      </div>
      <div class="projector-base" aria-hidden="true">
        <span class="base-glow"></span>
        <span class="base-orbit orbit-a"></span>
        <span class="base-orbit orbit-b"></span>
        <span class="base-axis"></span>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
